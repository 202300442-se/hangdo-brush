<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Hero video maker</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: auto; }
  #log { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 6px 10px; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<div id="log">ready</div>
<script>
// 항도제일특수브러쉬 메인 배경 영상 생성기
// - 회사 실사 사진 2장을 천천히 흐르듯 교차 + 떠다니는 미세 입자 + 부드러운 빛줄기
// - 모든 움직임이 주기 T의 정수배라 0초와 T초 화면이 같아 끊김 없이 반복된다.
const T = 10;            // 반복 주기 (초)
const FPS = 30;
const W = 1600, H = 900;
const IMAGES = ["roll-abrasive-grey-1600.webp", "machine-knot-detail-1600.webp"];

const c = document.getElementById("c");
const ctx = c.getContext("2d");
const log = (m) => (document.getElementById("log").textContent = m);
const TAU = Math.PI * 2;

// 결정적 난수 (매번 같은 영상)
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const particles = Array.from({ length: 80 }, () => ({
  x: rnd() * W,
  y: rnd() * H,
  r: 1 + rnd() * 3.2,
  rise: 1 + Math.floor(rnd() * 2),      // 주기 동안 화면 높이의 1~2배 상승
  sway: 6 + rnd() * 18,
  swayN: 1 + Math.floor(rnd() * 2),
  tw: 1 + Math.floor(rnd() * 3),
  ph: rnd() * TAU,
}));

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = "/photos/" + src;
  });
}

function drawCover(img, scale, dx, dy, alpha) {
  const s = Math.max(W / img.width, H / img.height) * scale;
  const w = img.width * s, h = img.height * s;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, (W - w) / 2 + dx, (H - h) / 2 + dy, w, h);
  ctx.globalAlpha = 1;
}

function frame(t, imgs) {
  const p = t / T; // 0..1
  ctx.fillStyle = "#050806";
  ctx.fillRect(0, 0, W, H);

  // 사진 A/B 교차 (B는 T/2에서 가장 선명)
  // 교차 구간을 짧게: 대부분은 한 장만 선명하게 보이도록
  const raw = 0.5 - 0.5 * Math.cos(TAU * p);
  const lin = Math.min(1, Math.max(0, (raw - 0.3) / 0.4));
  const mixB = lin * lin * (3 - 2 * lin);
  drawCover(imgs[0], 1.14 + 0.04 * Math.sin(TAU * p), 26 * Math.sin(TAU * p), 10 * Math.cos(TAU * p), 1);
  drawCover(imgs[1], 1.12 + 0.04 * Math.cos(TAU * p), -24 * Math.cos(TAU * p), 12 * Math.sin(TAU * p), mixB);

  // 색보정: 어둡고 차분한 녹회색 톤
  ctx.fillStyle = "rgba(6, 16, 10, 0.5)";
  ctx.fillRect(0, 0, W, H);

  // 빛줄기 (왼쪽 위에서 비스듬히)
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.filter = "blur(36px)";
  for (let k = 0; k < 3; k++) {
    const a = 0.06 + 0.05 * (0.5 + 0.5 * Math.sin(TAU * p * (k + 1) + k * 2));
    const x = 200 + k * 380 + 60 * Math.sin(TAU * p + k);
    const g = ctx.createLinearGradient(x, 0, x + 420, H);
    g.addColorStop(0, `rgba(190, 220, 190, ${a})`);
    g.addColorStop(1, "rgba(190, 220, 190, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 60, -10);
    ctx.lineTo(x + 90, -10);
    ctx.lineTo(x + 520, H + 10);
    ctx.lineTo(x + 220, H + 10);
    ctx.closePath();
    ctx.fill();
  }

  ctx.filter = "none";
  // 떠다니는 미세 입자 (보케)
  for (const q of particles) {
    const y = (((q.y - p * q.rise * H) % H) + H) % H;
    const x = q.x + q.sway * Math.sin(TAU * p * q.swayN + q.ph);
    const a = 0.1 + 0.32 * (0.5 + 0.5 * Math.sin(TAU * p * q.tw + q.ph));
    const g = ctx.createRadialGradient(x, y, 0, x, y, q.r * 4);
    g.addColorStop(0, `rgba(235, 245, 230, ${a})`);
    g.addColorStop(1, "rgba(235, 245, 230, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, q.r * 4, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // 비네팅
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function pickType() {
  const types = ["video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
}

window.preview = async () => {
  const imgs = await Promise.all(IMAGES.map(loadImg));
  const start = performance.now();
  const loop = (now) => {
    frame(((now - start) / 1000) % T, imgs);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  return "previewing";
};

window.record = async () => {
  const imgs = await Promise.all(IMAGES.map(loadImg));
  const type = pickType();
  if (!type) throw new Error("MediaRecorder unsupported");
  const stream = c.captureStream(FPS);
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 5_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const done = new Promise((r) => (rec.onstop = r));
  frame(0, imgs);
  rec.start();
  const start = performance.now();
  await new Promise((resolve) => {
    const loop = (now) => {
      const t = (now - start) / 1000;
      if (t >= T) {
        frame(T, imgs);
        return resolve();
      }
      frame(t, imgs);
      log(`recording ${t.toFixed(1)} / ${T}s (${type})`);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  await new Promise((r) => setTimeout(r, 120));
  rec.stop();
  await done;
  const blob = new Blob(chunks, { type });
  const ext = type.startsWith("video/mp4") ? "mp4" : "webm";
  const res = await fetch(`/save?ext=${ext}`, { method: "POST", body: blob });
  const msg = `${await res.text()} — ${(blob.size / 1e6).toFixed(2)} MB, ${type}`;
  log(msg);
  return msg;
};

// ?auto=preview | ?auto=record 로 바로 실행
const auto = new URLSearchParams(location.search).get("auto");
if (auto === "preview") window.preview().catch((e) => log("error: " + e));
if (auto === "record") window.record().catch((e) => log("error: " + e));
</script>
</body>
</html>
